<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Study Group Finder - New Study Group</title>
</head>
<body>
	<h1>Create a Study Group</h1>

	<form method="POST" th:action="@{/groups}" th:object="${studyGroup}">
		<div>
			<label for="course">Course:</label>
			<input type="text" id="course" th:field="*{course}"/>
			<span th:if="${#fields.hasErrors('course')}" th:errors="*{course}">Course Error</span>
		</div>
		<div>
			<label for="instructor">Instructor:</label>
			<input type="text" id="instructor" th:field="*{instructor}"/>
			<span th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}">Instructor Error</span>
		</div>
		<div>
			<label for="title">Title:</label>
			<input type="text" id="title" th:field="*{title}"/>
			<span th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title Error</span>
		</div>
		<div>
			<label for="description">Description:</label>
			<input type="text" id="description" th:field="*{description}"/>
			<span th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description Error</span>
		</div>
		<div>
			<label for="createdBy">Created By:</label>
			<input type="text" id="createdBy" th:field="*{createdBy}"/>
			<span th:if="${#fields.hasErrors('createdBy')}" th:errors="*{createdBy}">Created By Error</span>
		</div>
		<div>
			<label for="meetingTime">Meeting Time:</label>
			<input type="text" id="meetingTime" th:field="*{meetingTime}" placeholder="e.g. Tue/Thu 6 PM"/>
		</div>
		<div>
			<label for="location">Location:</label>
			<input type="text" id="location" th:field="*{location}" placeholder="e.g. Wells Library, Room 402"/>
		</div>
		<div>
			<label for="maxCapacity">Max Capacity:</label>
			<input type="number" id="maxCapacity" th:field="*{maxCapacity}" min="2" max="100"/>
			<span th:if="${#fields.hasErrors('maxCapacity')}" th:errors="*{maxCapacity}">Capacity Error</span>
		</div>
		<div>
			<button type="submit">Create Study Group</button>
		</div>
	</form>

	<p><a th:href="@{/groups}">Back to study groups</a></p>
</body>
</html>
